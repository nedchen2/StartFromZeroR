<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="selection_title selection_desc">
<title id="selection_title">Select a complete code block and click Run</title>
<desc id="selection_desc">The double-a-number badge matches the script comment of the same name. Select the two lines below it, click Run, and look for 40 in the Console. The object count still holds 20.</desc>
<rect width="1000" height="560" rx="16" fill="#f5f7f5"/>
<g font-family="Arial,sans-serif" fill="#173a35">
<text x="28" y="38" font-size="25">Select → Run → Check (illustration)</text>
<rect x="24" y="65" width="658" height="252" rx="10" fill="white" stroke="#b9cfc6"/>
<rect x="24" y="65" width="658" height="47" rx="10" fill="#e2eee8"/>
<text x="42" y="95" font-size="22">Source editor: my-01-first-run.R</text>
<rect x="476" y="73" width="90" height="32" rx="5" fill="#b6dfc8" stroke="#427b70"/>
<text x="493" y="97" font-size="21">Run ▶</text>
<rect x="576" y="73" width="94" height="32" rx="5" fill="#f2f2f2" stroke="#c4cbc7"/>
<text x="587" y="97" font-size="19" fill="#6c7d77">Source</text>
<rect x="38" y="161" width="630" height="83" rx="4" fill="#d9ebfc" stroke="#87afd4"/>
<g font-family="Menlo,Consolas,monospace" font-size="20">
<text x="44" y="146" fill="#6a7d74"># %% double-a-number</text>
<text x="44" y="190">count &lt;- 20  <tspan fill="#596e65"># Store 20 under the name count.</tspan></text>
<text x="44" y="225">count * 2</text>
<text x="44" y="280" fill="#6a7d74"># %% check-project-folder</text>
</g>
<rect x="24" y="340" width="658" height="190" rx="10" fill="white" stroke="#b9cfc6"/>
<text x="42" y="374" font-size="23">Console: read the result here</text>
<g font-family="Menlo,Consolas,monospace" font-size="22">
<text x="44" y="413">&gt; count &lt;- 20</text>
<text x="44" y="449">&gt; count * 2</text>
<text x="44" y="487">[1] 40</text>
</g>
<rect x="715" y="72" width="255" height="33" rx="6" fill="#e8eff6" stroke="#a0b3c5"/>
<text x="727" y="94" font-size="17" font-weight="bold" fill="#253e54">BLOCK · double-a-number</text>
<g font-size="22">
<text x="720" y="143">1. Select both lines.</text>
<text x="720" y="178">Stop before the next</text>
<text x="720" y="210"># %% label.</text>
<text x="720" y="280">2. Click Run.</text>
<text x="720" y="380">3. Check for 40.</text>
<text x="720" y="447">Environment:</text>
<text x="720" y="479">count is still 20.</text>
</g>
</g>
</svg>
