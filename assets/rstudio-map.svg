<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="16" fill="#f5f7f5"/><g font-family="Arial,sans-serif"><text x="24" y="38" font-size="22" fill="#173a35">A map of RStudio (illustration, not a screenshot)</text><g transform="translate(20 65)"><rect width="530" height="240" rx="10" fill="white" stroke="#b9cfc6"/><rect width="530" height="38" rx="10" fill="#e2eee8"/><text x="18" y="27" font-size="18" fill="#173a35">Source / your saved .R script</text><rect x="404" y="47" width="103" height="31" rx="5" fill="#e2eee8" stroke="#8bb5a8"/><text x="426" y="69" font-size="18" fill="#173a35">Run ▶</text><text x="20" y="84" font-size="19" fill="#173a35">Write a few lines here.</text><text x="20" y="121" font-size="18" fill="#425952">Put the cursor on a line.</text><text x="20" y="154" font-size="18" fill="#425952">Ctrl + Enter (Windows) or</text><text x="20" y="185" font-size="18" fill="#425952">Cmd + Enter (macOS) runs that line.</text></g><g transform="translate(20 322)"><rect width="530" height="214" rx="10" fill="white" stroke="#b9cfc6"/><rect width="530" height="38" rx="10" fill="#e2eee8"/><text x="18" y="27" font-size="18" fill="#173a35">Console / R executes code here</text><text x="20" y="83" font-size="18" fill="#173a35">&gt; 1 + 1</text><text x="20" y="116" font-size="18" fill="#173a35">[1] 2</text><text x="20" y="163" font-size="18" fill="#425952">Do not type the &gt; prompt yourself.</text></g><g transform="translate(570 65)"><rect width="410" height="200" rx="10" fill="white" stroke="#b9cfc6"/><text x="20" y="40" font-size="21" fill="#173a35">Environment</text><text x="20" y="85" font-size="18" fill="#425952">Objects currently in memory</text><text x="20" y="124" font-size="18" fill="#425952">These disappear after a restart.</text></g><g transform="translate(570 282)"><rect width="410" height="254" rx="10" fill="white" stroke="#b9cfc6"/><text x="20" y="42" font-size="21" fill="#173a35">Files / Plots / Help</text><text x="20" y="87" font-size="18" fill="#425952">Files: what exists on disk</text><text x="20" y="128" font-size="18" fill="#425952">Plots: figures made by R</text><text x="20" y="169" font-size="18" fill="#425952">Help: documentation</text><text x="20" y="217" font-size="16" fill="#6c7d77">Layouts can differ between versions.</text></g></g></svg>
