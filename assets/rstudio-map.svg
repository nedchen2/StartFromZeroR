<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="map_title map_desc">
<title id="map_title">Paste, Run, and see your R results</title>
<desc id="map_desc">A simplified RStudio layout. Paste AI code into the top-left script editor, select it and click Run. The bottom-left Console shows 25 and the bottom-right Plots pane shows four bars.</desc>
<rect width="1040" height="620" rx="18" fill="#f3f7f6"/>
<g font-family="Arial, sans-serif" fill="#173e3a">
<text x="24" y="38" font-size="23" font-weight="700">RStudio layout illustration</text>
<rect x="20" y="58" width="638" height="300" rx="9" fill="#fff" stroke="#b8cbc7"/>
<rect x="20" y="58" width="638" height="40" rx="9" fill="#dceae6"/>
<text x="39" y="85" font-size="17">Untitled1 · script editor</text>
<circle cx="43" cy="124" r="14" fill="#166b66"/><text x="39" y="130" font-size="17" fill="#fff">1</text>
<text x="67" y="130" font-size="19" font-weight="700">Paste your AI code here, then select it</text>
<rect x="40" y="148" width="595" height="181" rx="4" fill="#e7f0fb"/>
<g font-family="monospace" font-size="19" fill="#20394a">
<text x="55" y="180">counts &lt;- c(10, 20, 30, 40)</text>
<text x="55" y="211">mean(counts)</text>
<text x="55" y="254">barplot(counts,</text>
<text x="55" y="285">  names.arg = c("A", "B", "C", "D"))</text>
</g>
<circle cx="510" cy="78" r="14" fill="#166b66"/><text x="506" y="84" font-size="17" fill="#fff">2</text>
<rect x="532" y="64" width="105" height="28" rx="4" fill="#fff" stroke="#438e79"/>
<text x="555" y="84" font-size="18" font-weight="700">Run ▶</text>
<rect x="20" y="376" width="638" height="224" rx="9" fill="#fff" stroke="#b8cbc7"/>
<rect x="20" y="376" width="638" height="39" rx="9" fill="#dceae6"/>
<text x="39" y="402" font-size="17">Console</text>
<circle cx="43" cy="450" r="14" fill="#166b66"/><text x="39" y="456" font-size="17" fill="#fff">3</text>
<text x="67" y="456" font-size="19" font-weight="700">Look for the mean</text>
<text x="45" y="504" font-family="monospace" font-size="23">&gt; mean(counts)</text>
<text x="45" y="541" font-family="monospace" font-size="25" font-weight="700">[1] 25</text>
<rect x="678" y="58" width="342" height="166" rx="9" fill="#fff" stroke="#b8cbc7"/>
<text x="697" y="85" font-size="17" fill="#718a84">Environment</text>
<rect x="678" y="242" width="342" height="358" rx="9" fill="#fff" stroke="#b8cbc7"/>
<rect x="678" y="242" width="342" height="39" rx="9" fill="#dceae6"/>
<text x="697" y="269" font-size="17">Files</text><text x="750" y="269" font-size="17" font-weight="700">Plots</text><text x="808" y="269" font-size="17">Help</text>
<circle cx="702" cy="311" r="14" fill="#166b66"/><text x="698" y="317" font-size="17" fill="#fff">3</text>
<text x="725" y="317" font-size="19" font-weight="700">Look for four bars</text>
<path d="M725 349v195h260" fill="none" stroke="#6e827d" stroke-width="2"/>
<g fill="#b8c7c3" stroke="#52776a">
<rect x="748" y="497" width="38" height="47"/>
<rect x="804" y="450" width="38" height="94"/>
<rect x="860" y="403" width="38" height="141"/>
<rect x="916" y="356" width="38" height="188"/>
</g>
<g font-size="18" text-anchor="middle"><text x="767" y="573">A</text><text x="823" y="573">B</text><text x="879" y="573">C</text><text x="935" y="573">D</text></g>
</g></svg>
