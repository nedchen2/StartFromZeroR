<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300"><rect width="1100" height="300" rx="20" fill="#f6f5f0"/><g font-family="Arial,sans-serif"><g transform="translate(25 30)"><rect width="325" height="238" rx="16" fill="white" stroke="#cddfd9"/><text x="22" y="39" font-size="16" fill="#166b66">01 / READ</text><text x="22" y="80" font-size="29" fill="#173a35">The textbook</text><text x="22" y="121" font-size="19" fill="#425952">Understand the task.</text><text x="22" y="151" font-size="19" fill="#425952">See an expected output.</text><text x="22" y="205" font-size="17" fill="#6c7d77">A page is not an R interpreter.</text></g><g transform="translate(388 30)"><rect width="325" height="238" rx="16" fill="white" stroke="#cddfd9"/><text x="22" y="39" font-size="16" fill="#166b66">02 / ASK</text><text x="22" y="80" font-size="29" fill="#173a35">Your AI chat</text><text x="22" y="121" font-size="19" fill="#425952">Request one small step.</text><text x="22" y="151" font-size="19" fill="#425952">Question its assumptions.</text><text x="22" y="205" font-size="17" fill="#6c7d77">An answer is not a verified run.</text></g><g transform="translate(751 30)"><rect width="325" height="238" rx="16" fill="white" stroke="#cddfd9"/><text x="22" y="39" font-size="16" fill="#166b66">03 / RUN AND CHECK</text><text x="22" y="80" font-size="29" fill="#173a35">RStudio</text><text x="22" y="121" font-size="19" fill="#425952">Execute the code.</text><text x="22" y="151" font-size="19" fill="#425952">Inspect and save evidence.</text><text x="22" y="205" font-size="17" fill="#6c7d77">You decide whether it is valid.</text></g></g></svg>
