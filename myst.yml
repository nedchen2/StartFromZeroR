version: 1
project:
  id: start-from-zero-r
  title: Your first R code with AI
  subtitle: Ask, copy, run, and try one change.
  authors:
    - name: Congjia Chen
  description: Install R and RStudio, ask AI for code, paste and run it, change a chart and save one script.
  toc:
    - file: intro.md
    - title: Start from zero
      children:
        - file: chapters/00-start-here.md
        - file: chapters/01-ask-ai.md
        - file: chapters/02-copy-and-run.md
        - file: chapters/03-change-and-save.md
  exclude:
    - .build-venv/**
    - .R-library/**
    - .jupyter/**
    - .tools/**
    - _build/**
    - tools/**
    - outputs/**
    - validation/**
    - README.md
site:
  template: book-theme
  title: Your first R code with AI
  options:
    logo: assets/logo.svg
    favicon: assets/favicon.ico
    logo_text: R with AI
    logo_alt: Code prompt and sparkle
    style: assets/book.css
    hide_authors: true
    hide_made_with_myst: false
